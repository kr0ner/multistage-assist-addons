name: "Semantic Cache Add-on"
version: "1.0.22"
slug: "semantic_cache"
description: "Semantic cache lookup for Multi-Stage Assist"
url: "https://github.com/kr0ner/semantic-cache-addon"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
map:
  - homeassistant_config:ro
  - share:rw
ports:
  9876/tcp: 9876
ports_description:
  9876/tcp: "Cache API"
options:
  embedding_model: "/share/semantic-cache/models/bge-m3-smart-cache"
  classifier_model: "/share/semantic-cache/models/classifier"
  classifier_confidence_threshold: 0.6
  device: "cpu"
  port: 9876
  HF_HOME: "/share/semantic-cache"
  anchors_file: "/homeassistant/.storage/multistage_assist_anchors.json"
  user_cache_file: "/homeassistant/.storage/multistage_assist_semantic_cache.json"
  hybrid_alpha: 1.0
  vector_threshold: 0.5
  vector_top_k: 10
  hybrid_ngram_size: 2
  production_mode: true
  prod_cache_key: ""
schema:
  embedding_model: str
  classifier_model: str
  classifier_confidence_threshold: "float(0.1,1.0)"
  device: list(auto|cpu|cuda|mps)
  port: int
  HF_HOME: str
  anchors_file: str
  user_cache_file: str
  hybrid_alpha: float
  vector_threshold: float
  vector_top_k: int
  hybrid_ngram_size: int
  production_mode: bool
  prod_cache_key: str?
